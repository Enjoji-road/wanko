<!doctype html><html lang="ja"><meta charset="utf-8"><title>わんこそば・ローカル表示検証</title><style>body{font:12px sans-serif;background:#e6e6e6;margin:0}header{padding:8px;display:flex;gap:12px;align-items:center;position:sticky;top:0;background:#eee;z-index:2}iframe{display:block;border:0;margin:8px auto;background:white;box-shadow:0 0 0 1px #777}button,select{padding:6px}</style><header><label>画面 <select id="size"><option value="390,844">390×844</option><option value="320,568">320×568</option><option value="390,500">390×500（キーボード相当）</option><option value="844,390">844×390 横向き</option><option value="1280,900">1280×900</option></select></label><button id="keyboard">キーボード相当：OFF</button><button id="motion">動きを減らす：OFF</button><button id="corrupt">検証用保存を破損させて再読込</button><button id="jump">時計を91秒進める（検証専用）</button><output id="status">dist/qa.htmlへ一時コピーして使う検証専用ページ</output></header><iframe id="game" title="検証中のゲーム" src="./" width="390" height="844"></iframe><script>
const game=document.getElementById('game');let keyboard=false,reduced=false;
document.getElementById('size').onchange=e=>{const[w,h]=e.target.value.split(',');game.width=w;game.height=h;};
document.getElementById('keyboard').onclick=e=>{keyboard=!keyboard;game.contentDocument.body.classList.toggle('keyboard-open',keyboard);e.target.textContent='キーボード相当：'+(keyboard?'ON':'OFF');};
document.getElementById('motion').onclick=e=>{reduced=!reduced;game.contentWindow.matchMedia=()=>({matches:reduced,addEventListener(){}});e.target.textContent='動きを減らす：'+(reduced?'ON':'OFF');game.contentWindow.location.reload();game.onload=()=>{if(reduced){const style=game.contentDocument.createElement('style');style.textContent='*,*:before,*:after{animation:none!important;transition:none!important}';game.contentDocument.head.append(style);}};};
document.getElementById('corrupt').onclick=()=>{game.contentWindow.localStorage.setItem('wanko-local-records-v1','{broken-json');game.contentWindow.location.reload();};
document.getElementById('jump').onclick=()=>{const win=game.contentWindow,now=win.Date.now;win.Date.now=()=>now()+91000;document.getElementById('status').textContent='時計を91秒進めました';};
const ime=document.createElement('button');ime.id='ime';ime.textContent='IME変換中の送信テスト';document.querySelector('header').append(ime);
ime.onclick=()=>{const win=game.contentWindow,doc=game.contentDocument,input=doc.getElementById('answerInput'),before=doc.getElementById('score').textContent;input.dispatchEvent(new win.CompositionEvent('compositionstart',{bubbles:true}));doc.getElementById('answerForm').requestSubmit();const after=doc.getElementById('score').textContent;input.dispatchEvent(new win.CompositionEvent('compositionend',{bubbles:true}));document.getElementById('status').textContent=before===after?'IME変換中：得点も問題も変化なし':'IME不具合';};
</script></html>
