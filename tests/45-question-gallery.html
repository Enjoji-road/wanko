<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>追加9問・描画確認用</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="choices.css?v=2"><link rel="stylesheet" href="puzzles-extra.css?v=6">
<style>body.is-playing{padding:14px}.gallery-controls{display:flex;gap:12px;align-items:center;margin-bottom:14px}.gallery-controls button{padding:10px;min-height:40px}#cards{display:grid;grid-template-columns:repeat(3,360px);gap:18px;justify-content:center}.gallery-card{min-width:0}.gallery-card .question-bowl{padding:14px!important}.gallery-card .choice-buttons{margin-top:14px}.gallery-card h2{font-size:19px!important}.gallery-card .question-instruction{font-size:13px!important}.gallery-card .puzzle-visual{min-height:155px!important}.gallery-card .choice-button{min-height:50px;font-size:19px}.gallery-card .choice-number{font-size:12px}</style>
<body class="is-playing"><nav class="gallery-controls"><strong>開発用・追加9問の描画確認（採点なし）</strong><button data-page="0">37〜39問</button><button data-page="1">40〜42問</button><button data-page="2">43〜45問</button></nav><div id="cards"></div>
<script src="questions.js?v=6"></script><script src="puzzle-view.js?v=6"></script><script>
function show(page){const cards=document.getElementById('cards');cards.replaceChildren();for(const q of WankoQuestions.slice(36+page*3,39+page*3)){const article=document.createElement('article');article.className='gallery-card puzzle-station';const bowl=document.createElement('div');bowl.className='question-bowl';const title=document.createElement('h2');title.textContent=q.title;const instruction=document.createElement('p');instruction.className='question-instruction';instruction.textContent=q.instruction;const content=document.createElement('div');content.className='puzzle-content';content.innerHTML=WankoPuzzleView.render(q);bowl.append(title,instruction,content);const choices=document.createElement('div');choices.className='choice-buttons';q.choices.forEach((c,i)=>{const b=document.createElement('button');b.className='choice-button';b.disabled=true;const number=document.createElement('span');number.className='choice-number';number.textContent=i+1;const word=document.createElement('span');word.className='choice-word';word.textContent=c;b.append(number,word);choices.append(b);});article.append(bowl,choices);cards.append(article);}}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(+b.dataset.page));show(0);
</script></body></html>
